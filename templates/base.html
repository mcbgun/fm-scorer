<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FM24 Scorer{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">FM24 Scorer</a>
            <div class="d-flex gap-3">
                <a class="nav-link {% block nav_upload %}text-light{% endblock %}" href="/">Upload</a>
                <a class="nav-link text-success fw-bold" href="/quickstart">Quick Start</a>
                <a class="nav-link {% block nav_squad %}text-light{% endblock %}" href="/squad">Squad</a>
                <a class="nav-link {% block nav_youth %}text-light{% endblock %}" href="/youth">Youth</a>
                <a class="nav-link {% block nav_sell %}text-light{% endblock %}" href="/sell">Sell</a>
                <a class="nav-link {% block nav_strategy %}text-light{% endblock %}" href="/strategy">Strategy</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
